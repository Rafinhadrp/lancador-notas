name: Gerar programa do PC (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agente/**", "extensao/**", ".github/workflows/programa-pc.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: agente
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Gerar LancadorNotas.exe
        working-directory: agente
        run: >
          python gerar_exe.py --noconfirm --onefile --windowed --clean
          --name LancadorNotas
          --icon icone.ico
          --splash splash.png
          --add-data "logo.png;."
          --add-data "icone.png;."
          --add-data "icone.ico;."
          --add-data "mascote;mascote"
          --collect-all customtkinter
          --collect-all playwright
          lancador.py

      - name: Gerar versao.json (versão, hash e tamanho do .exe)
        working-directory: agente
        shell: python
        run: |
          import hashlib, json, os, re, zipfile
          # extensão do Chrome: LancadorConsultas.zip com a pasta LancadorConsultas/ dentro
          with zipfile.ZipFile(os.path.join("dist", "LancadorConsultas.zip"), "w", zipfile.ZIP_DEFLATED) as z:
              for raiz, _, arquivos in os.walk(os.path.join("..", "extensao")):
                  for a in arquivos:
                      caminho = os.path.join(raiz, a)
                      z.write(caminho, os.path.join("LancadorConsultas", os.path.relpath(caminho, os.path.join("..", "extensao"))))
          versao_ext = json.load(open(os.path.join("..", "extensao", "manifest.json"), encoding="utf-8"))["version"]
          versao = re.search(r'VERSAO = "([^"]+)"', open("central.py", encoding="utf-8").read()).group(1)
          extra = json.load(open("versao.json", encoding="utf-8"))
          exe = os.path.join("dist", "LancadorNotas.exe")
          dados = open(exe, "rb").read()
          info = {"versao": versao, "obrigatoria": bool(extra.get("obrigatoria")),
                  "novidades": extra.get("novidades", ""),
                  "sha256": hashlib.sha256(dados).hexdigest(), "tamanho": len(dados), "extensao": versao_ext}
          json.dump(info, open(os.path.join("dist", "versao.json"), "w", encoding="utf-8"), ensure_ascii=False)
          print(json.dumps(info))  # ASCII: o console do Windows pode não aceitar acentos

      - name: Guardar o .exe
        uses: actions/upload-artifact@v4
        with:
          name: LancadorNotas
          path: agente/dist/LancadorNotas.exe

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: programa
          name: Programa do PC
          body: "Baixe o LancadorNotas.exe abaixo. Gerado automaticamente a cada atualização. O programa (a partir da 1.2.0) avisa e se atualiza sozinho pelo versao.json."
          files: |
            agente/dist/LancadorNotas.exe
            agente/dist/versao.json
            agente/dist/LancadorConsultas.zip
          make_latest: true
