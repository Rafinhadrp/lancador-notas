name: Teste da tela de abertura
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 pillow
      - name: Gerar exe de teste (console + debug do bootloader)
        working-directory: agente
        run: python gerar_exe.py --noconfirm --onefile --console --debug bootloader --name TesteSplash --splash splash.png --add-data "mascote;mascote" --paths . teste/app_teste.py
      - name: Rodar e fotografar
        working-directory: agente
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $p = Start-Process -FilePath dist\TesteSplash.exe -RedirectStandardError err.txt -RedirectStandardOutput out.txt -PassThru
          foreach ($t in 1,3,5) {
            Start-Sleep -Seconds 2
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("tela$t.png")
          }
          $p.WaitForExit(20000) | Out-Null
          if (!$p.HasExited) { "AINDA RODANDO"; Stop-Process $p -Force }
          "---- stderr"; Get-Content err.txt | Select-String -Pattern "SPLASH|splash|Tcl|tcl|error|Error" | Select-Object -First 60
          "---- stdout"; Get-Content out.txt -Tail 20
          Get-ChildItem build\TesteSplash\*.tcl | ForEach-Object { "---- script $($_.Name) $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-splash
          path: |
            agente/tela*.png
            agente/err.txt
            agente/out.txt
            agente/build/TesteSplash/*.tcl
