<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

  .topo { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }

  b { display: block; margin-bottom: 2px; } p { color: #93a1b2; margin: 0; font-size: 13px; }
  .sec { margin-top: 8px; background: transparent; color: #93a1b2; border: 1px solid #2e3d50; font-weight: 500; }
  .sec:hover { color: #e8eef5; }
  button { width: 100%; background: #7db4f8; color: #06121f; border: 0; border-radius: 10px; padding: 10px; font: 600 14px inherit; cursor: pointer; font-family: inherit; }
</style></head>
<body>
  <div class="topo">
    <img id="mascote" src="mascote/parado.gif" alt="">
    <div><b id="titulo">Lançador · Consultas</b><p id="sub">Consultas do Detran e do IPVA e avisos pelo WhatsApp.</p></div>
